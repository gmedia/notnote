name: Task
description: A scoped unit of work that an agent can claim and finish in one pull request.
title: '[task] '
labels: ['type:feat']
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One sentence. The measurable outcome, not the activity.
      placeholder: Reduce placeholder rate below 5% for the Notion fixture corpus.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Each line must be verifiable by a command, a test, or a report.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: write_set
    attributes:
      label: write_set
      description: Path globs this task may modify. Required for claiming.
      value: |
        ```
        packages/example/**
        ```
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      value: |
        -
    validations:
      required: true

  - type: input
    id: depends_on
    attributes:
      label: Depends on
      description: Issue numbers, or "None".
      placeholder: None
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options:
        - normal
        - critical
    validations:
      required: true

  - type: input
    id: rollback
    attributes:
      label: Rollback
      description: How to undo this safely.
      placeholder: Revert the pull request. No migration.
    validations:
      required: true
