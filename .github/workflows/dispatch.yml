name: Dispatch

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the plan without claiming
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Assign ready issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          LIVE_FLAG: ${{ vars.DISPATCH_LIVE }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_DRY_RUN" = "false" ]; then MODE=live; else MODE=dry-run; fi
          else
            if [ "$LIVE_FLAG" = "true" ]; then MODE=live; else MODE=dry-run; fi
          fi

          echo "event=$EVENT_NAME mode=$MODE live_flag=${LIVE_FLAG:-unset}"

          if [ "$MODE" = "live" ]; then
            node scripts/dispatch.mjs
          else
            node scripts/dispatch.mjs --dry-run
          fi
