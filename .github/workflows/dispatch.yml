name: Dispatch

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the plan without claiming
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Assign ready issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/dispatch.mjs --dry-run
          else
            node scripts/dispatch.mjs
          fi
